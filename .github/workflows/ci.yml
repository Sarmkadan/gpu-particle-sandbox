name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Plain OpenTK/OpenGL code with no Windows-only APIs, so ubuntu-latest is enough.
    # No GPU runner here, so nothing in this job creates an OpenGL context.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The solution's project targets net8.0 and there is no global.json, so pin the 8.0 SDK line.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GpuParticleSandbox.sln

      - name: Build
        run: dotnet build --no-restore -c Release GpuParticleSandbox.sln

      - name: Test
        run: dotnet test --no-build -c Release GpuParticleSandbox.sln
